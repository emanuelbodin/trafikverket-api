apiVersion: 1

# Loki is private on Railway. LOKI_URL should be http://<loki private domain>:3100
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: ${LOKI_URL}
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: requestId
          matcherRegex: '"requestId":"([^"]+)"'
          matcherType: regex
